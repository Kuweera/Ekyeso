name: Build Omeso APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Apply custom app icon
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp resources/icon-mdpi.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp resources/icon-mdpi.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp resources/icon-hdpi.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp resources/icon-hdpi.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp resources/icon-xhdpi.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp resources/icon-xhdpi.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp resources/icon-xxhdpi.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp resources/icon-xxhdpi.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp resources/icon-xxxhdpi.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp resources/icon-xxxhdpi.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Copy web assets into Android project
        run: npx cap sync android

      - name: Force the build to use our fixed debug keystore
        run: |
          cp keystore/debug.keystore android/app/debug.keystore
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/build.gradle')
          src = p.read_text()

          signing_block = '''
              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          '''

          if 'signingConfigs' not in src:
              src = src.replace('android {', 'android {' + signing_block, 1)

          if 'signingConfig signingConfigs.debug' not in src:
              src = re.sub(r'(buildTypes\s*\{)', r'\1\n        debug {\n            signingConfig signingConfigs.debug\n        }', src, count=1)

          p.write_text(src)
          print("--- Patched android/app/build.gradle ---")
          print(src)
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Confirm which key actually signed the APK
        run: |
          echo "--- Signer info baked into the built APK ---"
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA256|Owner|Valid"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Omeso-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
